<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Explore course modules and learning resources in the LMS."
    >

    <title>LMS — Modules</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- Shared Navbar -->

    <div id="navbar-container"></div>



    <main>


        <!-- =================================================
             PAGE HEADER
             ================================================= -->

        <section class="page-hero">

            <div class="container">

                <div class="page-hero-content">

                    <span class="section-eyebrow">

                        <i class="fa-solid fa-layer-group"></i>

                        Course Content

                    </span>


                    <h1 id="modulesTitle">
                        Course Modules
                    </h1>


                    <p id="modulesDescription">
                        Explore the modules and learning resources
                        available in this course.
                    </p>

                </div>

            </div>

        </section>



        <!-- =================================================
             MODULE CONTENT
             ================================================= -->

        <section class="section">

            <div class="container">


                <!-- Course information -->

                <div
                    id="modulesCourseInfo"
                    class="detail-hero"
                >

                    <div class="loading-state">

                        <div class="loading-spinner"></div>

                        <p>
                            Loading course information...
                        </p>

                    </div>

                </div>



                <!-- Module list -->

                <div class="content-stack">


                    <div class="panel">

                        <div class="panel-header">

                            <div>

                                <span class="section-eyebrow">
                                    Learning Path
                                </span>

                                <h2>
                                    Course Modules
                                </h2>

                            </div>

                        </div>


                        <div
                            id="modulesContainer"
                            class="module-list"
                        >

                            <div class="loading-state">

                                <div class="loading-spinner"></div>

                                <p>
                                    Loading modules...
                                </p>

                            </div>

                        </div>

                    </div>


                </div>


            </div>

        </section>


    </main>



    <!-- Shared Footer -->

    <div id="footer-container"></div>



    <!-- Global JavaScript -->

    <script src="js/script.js"></script>

    <!-- Modules JavaScript -->

    <script src="js/modules.js"></script>


</body>

</html>
