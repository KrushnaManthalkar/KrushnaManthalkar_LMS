<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="View and continue your enrolled LMS courses."
    >

    <title>LMS — My Courses</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- Shared Navbar -->

    <div id="navbar-container"></div>



    <main>


        <!-- =================================================
             PAGE HEADER
             ================================================= -->

        <section class="page-hero">

            <div class="container">

                <div class="page-hero-content">

                    <span class="section-eyebrow">

                        <i class="fa-solid fa-book-open"></i>

                        Learning Library

                    </span>


                    <h1>
                        My Courses
                    </h1>


                    <p>
                        Continue your enrolled courses and
                        keep moving forward with your learning.
                    </p>

                </div>

            </div>

        </section>



        <!-- =================================================
             COURSE CONTENT
             ================================================= -->

        <section class="section">

            <div class="container">


                <!-- Toolbar -->

                <div class="toolbar">

                    <div>

                        <span class="section-eyebrow">
                            Your Learning
                        </span>

                        <h2>
                            Enrolled Courses
                        </h2>

                    </div>


                    <div class="toolbar-actions">

                        <a
                            href="courses.html"
                            class="btn btn-primary"
                        >

                            <i class="fa-solid fa-plus"></i>

                            Explore Courses

                        </a>

                    </div>

                </div>



                <!-- Course list -->

                <div
                    id="myCoursesContainer"
                    class="course-grid"
                >

                    <div class="loading-state">

                        <div class="loading-spinner"></div>

                        <p>
                            Loading your courses...
                        </p>

                    </div>

                </div>


            </div>

        </section>


    </main>



    <!-- Shared Footer -->

    <div id="footer-container"></div>



    <!-- Global JavaScript -->

    <script src="js/script.js"></script>

    <!-- My Courses JavaScript -->

    <script src="js/my-courses.js"></script>


</body>

</html>
